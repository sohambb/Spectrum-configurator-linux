version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Routine updates merge on their own, so give a bad or hijacked version time to be noticed.
    cooldown:
      default-days: 7
    groups:
      # These must move together: React rejects a react-dom of a different version.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # The React plugin only supports particular Vite majors.
      vite:
        patterns: ["vite", "@vitejs/*"]
    ignore:
      # Must match the Node version in the workflows. Raise both together by hand.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
  - package-ecosystem: cargo
    directory: /crates/spectrum-protocol
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
