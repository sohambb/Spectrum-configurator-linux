name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  appimage:
    # Write access is only used by the last step. Checkout does not keep the token, so the build steps never see it.
    permissions:
      contents: write
    timeout-minutes: 30
    # The oldest runner image with the Tauri 2 build dependencies, so the AppImage runs on older distros too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match version $version in tauri.conf.json" >&2; exit 1; }

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config

      - name: Check the embedded udev rule
        run: tests/embedded-rule.sh

      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path crates/spectrum-protocol/Cargo.toml
      - run: npm run tauri build -- --bundles appimage

      - name: Collect release files
        run: |
          mkdir release
          cp src-tauri/target/release/bundle/appimage/*.AppImage release/Spectrum-Configurator-x86_64.AppImage
          cp packaging/70-spectrum-configurator.rules release/
          cp src-tauri/icons/128x128.png release/spectrum-configurator.png
          cd release
          sha256sum Spectrum-Configurator-x86_64.AppImage 70-spectrum-configurator.rules spectrum-configurator.png > SHA256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "$GITHUB_REF_NAME" --generate-notes --draft
