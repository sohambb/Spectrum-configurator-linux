name: Check

# Runs on every pull request, including Dependabot's, so a broken update is visible before it is merged.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # Same runner and Node version as release.yml, so this also tests the release build.
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libudev-dev pkg-config

      - run: shellcheck install.sh tests/embedded-rule.sh scripts/*.sh
      - run: tests/embedded-rule.sh
      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path crates/spectrum-protocol/Cargo.toml
      - run: cargo clippy --manifest-path crates/spectrum-protocol/Cargo.toml --all-targets -- -D warnings
      - run: npm run tauri build -- --bundles appimage
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

  # Merges Dependabot's routine updates once the check job above has passed. Everything else waits for a person.
  automerge:
    needs: check
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: update

      # This job never checks out or runs the pull request's code.
      - name: Merge if it is a routine update
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UPDATE_TYPE: ${{ steps.update.outputs.update-type }}
        run: |
          wait_for_person() { echo "::notice::Not merged automatically: $1"; exit 0; }

          case "$UPDATE_TYPE" in
            version-update:semver-patch | version-update:semver-minor) ;;
            *) wait_for_person "not a patch or minor update ($UPDATE_TYPE)" ;;
          esac

          # Only the app's own manifests. This leaves out workflow files, which run with release
          # permissions, and the protocol crate, which must stay the same as the Windows repo.
          files=$(gh pr diff "$PR" --name-only)
          if grep -qvxE 'package(-lock)?\.json|src-tauri/Cargo\.(toml|lock)' <<<"$files"; then
            wait_for_person "it changes files other than the app's package manifests"
          fi

          # hidapi carries every write to the mouse, which CI cannot test.
          hidapi_version() {
            gh api "repos/$GH_REPO/contents/src-tauri/Cargo.lock?ref=$1" -H "Accept: application/vnd.github.raw" |
              grep -A1 '^name = "hidapi"$' | tail -n 1
          }
          before=$(hidapi_version "$BASE_SHA")
          after=$(hidapi_version "$HEAD_SHA")
          [ -n "$before" ] && [ "$before" = "$after" ] || wait_for_person "it changes hidapi"

          gh pr merge "$PR" --rebase --match-head-commit "$HEAD_SHA"
